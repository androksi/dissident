<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TidyWin</title>
<meta name="description" content="Set up and look after your Windows PC from one window. One command in PowerShell.">
<link rel="icon" href="https://raw.githubusercontent.com/androksi/tidywin/main/assets/logo.svg">
<style>
  :root { --bg: #08090c; --fg: #f2f4f8; --fg2: #9aa3b2; --line: rgba(255, 255, 255, .14); --glass: rgba(255, 255, 255, .06); --ok: #7ee2a8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
         font: 15px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; }

  /* Colored light behind everything, blurred */
  .glow { position: fixed; inset: 0; z-index: 0; filter: blur(90px); opacity: .55; pointer-events: none; }
  .glow span { position: absolute; border-radius: 50%; animation: drift 22s ease-in-out infinite alternate; }
  .glow span:nth-child(1) { width: 46vmax; height: 46vmax; left: -10vmax; top: -14vmax; background: #2f6bff; }
  .glow span:nth-child(2) { width: 38vmax; height: 38vmax; right: -12vmax; top: 10vmax; background: #8a3cff; animation-duration: 28s; }
  .glow span:nth-child(3) { width: 34vmax; height: 34vmax; left: 20vmax; bottom: -18vmax; background: #00b8a9; animation-duration: 25s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .5;
           background: radial-gradient(ellipse at center, transparent 0, var(--bg) 85%); }

  main { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; padding: 32px 16px; gap: 0; }
  .logo { width: 64px; height: 64px; margin-bottom: 20px; filter: drop-shadow(0 8px 30px rgba(47, 107, 255, .45)); }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 72px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05;
       background: linear-gradient(180deg, #fff 30%, #b9c3d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { margin: 14px 0 40px; color: var(--fg2); font-size: clamp(15px, 2.4vw, 18px); max-width: 30em; }

  .run { box-sizing: border-box; cursor: text; display: inline-flex; align-items: center; gap: 14px;
         max-width: 100%; padding: 18px 24px; border: 1px solid var(--line); border-radius: 14px;
         background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
         box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
         font: 500 clamp(14px, 2.6vw, 18px)/1.4 "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
         transition: border-color .2s, transform .2s, background .2s; }
  .run:hover, .run:focus-visible { border-color: rgba(255, 255, 255, .32); background: rgba(255, 255, 255, .09); transform: translateY(-1px); }
  .run .prompt { color: var(--fg2); user-select: none; }
  .run:focus { outline: none; }
  /* One click selects the whole command: the page never writes to the clipboard (blockers flag that, see ClickFix) */
  .run code { font: inherit; overflow-wrap: anywhere; text-align: left; -webkit-user-select: all; user-select: all; }
  .run code::selection { background: rgba(76, 194, 255, .35); }
  .run.copied { border-color: var(--ok); }
  .run.copied code { color: var(--ok); }
  .hint { margin: 14px 0 0; color: var(--fg2); font-size: 13px; min-height: 1.5em; }

  footer { position: fixed; z-index: 2; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 13px; }
  footer a { color: var(--fg2); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  footer svg { width: 16px; height: 16px; fill: currentColor; }
  footer a:hover, footer a:focus-visible { color: var(--fg); }

  @media (prefers-reduced-motion: reduce) { .glow span { animation: none; } .run { transition: none; } }
  @media (max-height: 520px) { body { overflow: auto; } footer { position: static; padding-bottom: 20px; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="grain" aria-hidden="true"></div>
<main>
  <img class="logo" src="https://raw.githubusercontent.com/androksi/tidywin/main/assets/logo.svg" alt="">
  <h1>TidyWin</h1>
  <p class="tagline">Set up and look after your Windows 10 or 11 PC from one window.</p>
  <div class="run" id="run" tabindex="0" aria-label="The command">
    <span class="prompt">PS&gt;</span>
    <code id="cmd"></code>
  </div>
  <p class="hint" id="hint">Copy the command, paste it into Terminal and press Enter.</p>
</main>
<footer>
  <a href="https://github.com/androksi/tidywin">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    androksi/tidywin
  </a>
</footer>
<script>
  // The one command. A click selects it (user-select: all); copying is up to you, with Ctrl+C or the
  // right-click menu: a page that writes a command to the clipboard looks like ClickFix to blockers.
  const cmd = "irm __SHORT__/run | iex";
  const run = document.getElementById("run");
  const code = document.getElementById("cmd");
  const hint = document.getElementById("hint");
  const hintText = hint.textContent;
  code.textContent = cmd;
  const select = () => {
    const range = document.createRange();
    range.selectNodeContents(code);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    hint.textContent = "Selected. Press Ctrl+C, paste it into Terminal and press Enter.";
  };
  run.addEventListener("click", select);
  run.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } });
  document.addEventListener("copy", () => {
    if (!window.getSelection().toString().includes("irm")) return;
    run.classList.add("copied");
    hint.textContent = "Copied. Paste it into Terminal and press Enter.";
    setTimeout(() => { run.classList.remove("copied"); hint.textContent = hintText; }, 3000);
  });
</script>
</body>
</html>
