<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TidyWin</title>
<meta name="description" content="PowerShell scripts that remove telemetry, ads and preinstalled apps from Windows.">
<link rel="icon" href="https://raw.githubusercontent.com/androksi/tidywin/main/assets/logo.svg">
<style>
  body { margin: 0; background: #111; color: #ddd; font: 15px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; color: #fff; }
  p { margin: 0 0 32px; color: #888; }
  ul { list-style: none; margin: 0 0 32px; padding: 0; }
  li { padding: 2px 0; overflow-x: auto; white-space: nowrap; }
  button { all: unset; cursor: pointer; }
  button:hover, button:focus-visible { color: #fff; text-decoration: underline; }
  .copied { color: #7c7; }
  a { color: #888; }
  a:hover { color: #fff; }
</style>
</head>
<body>
<main>
  <h1>TidyWin</h1>
  <p>Run in PowerShell. Click a command to copy it.</p>

  <ul id="apply"></ul>
  <ul id="undo"></ul>

  <a href="https://github.com/androksi/tidywin">github.com/androksi/tidywin</a>
</main>
<script>
  const base = "__SHORT__";
  const lists = {
    apply: ["windows", "apps", "chrome", "brave", "firefox"],
    undo:  ["windows-revert", "chrome-revert", "brave-revert", "firefox-revert"],
  };
  for (const [id, names] of Object.entries(lists)) {
    for (const name of names) {
      const cmd = `irm ${base}/${name} | iex`;
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.textContent = cmd;
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(cmd); } catch { return; }
        btn.textContent = "copied";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = cmd; btn.classList.remove("copied"); }, 1200);
      });
      li.appendChild(btn);
      document.getElementById(id).appendChild(li);
    }
  }
</script>
</body>
</html>
