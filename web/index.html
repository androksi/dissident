<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TidyWin</title>
<meta name="description" content="PowerShell scripts that remove telemetry, ads and preinstalled apps from Windows.">
<link rel="icon" href="https://raw.githubusercontent.com/androksi/tidywin/main/assets/logo.svg">
<style>
  body { margin: 0; background: #111; color: #ddd; font: 15px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 22px; color: #fff; }
  .lang { display: flex; gap: 8px; }
  .lang button { all: unset; cursor: pointer; line-height: 0; opacity: .4; }
  .lang button[aria-pressed="true"], .lang button:hover { opacity: 1; }
  .lang button:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
  .lang svg { width: 28px; height: 20px; border-radius: 2px; }
  .intro { margin: 0 0 40px; color: #888; }
  h2 { margin: 0 0 16px; font-size: 15px; color: #888; font-weight: 400; }
  ul { list-style: none; margin: 0 0 40px; padding: 0; }
  li { margin-bottom: 18px; }
  .cmd { all: unset; cursor: pointer; color: #fff; overflow-wrap: anywhere; }
  .cmd:hover, .cmd:focus-visible { text-decoration: underline; }
  .copied { color: #7c7; }
  .desc { margin: 2px 0 0; color: #999; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: #888; width: fit-content; }
  summary:hover, summary:focus-visible { color: #fff; }
  details h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 400; color: #fff; }
  dl { margin: 8px 0 0; padding-left: 16px; border-left: 1px solid #333; }
  dt { color: #ddd; }
  .tag { color: #7a9; }
  dd { margin: 0 0 8px; color: #999; }
  a { color: #888; }
  a:hover { color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TidyWin</h1>
    <div class="lang">
      <button type="button" data-lang="en" aria-label="English">
        <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" fill="#b22234"/><g fill="#fff"><rect y="1.54" width="28" height="1.54"/><rect y="4.62" width="28" height="1.54"/><rect y="7.69" width="28" height="1.54"/><rect y="10.77" width="28" height="1.54"/><rect y="13.85" width="28" height="1.54"/><rect y="16.92" width="28" height="1.54"/></g><rect width="12" height="10.77" fill="#3c3b6e"/></svg>
      </button>
      <button type="button" data-lang="pt" aria-label="Português (Brasil)">
        <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" fill="#009c3b"/><path d="M14 2.5 25.5 10 14 17.5 2.5 10z" fill="#ffdf00"/><circle cx="14" cy="10" r="4.4" fill="#002776"/></svg>
      </button>
    </div>
  </header>
  <p class="intro" data-t="intro"></p>

  <h2 data-t="apply"></h2>
  <ul id="apply"></ul>

  <h2 data-t="check"></h2>
  <ul id="check"></ul>

  <h2 data-t="undo"></h2>
  <ul id="undo"></ul>

  <a href="https://github.com/androksi/tidywin">github.com/androksi/tidywin</a>
</main>

  const lists = {
    apply: ["windows", "apps", "fonts", "chrome", "brave", "firefox", "dev"],
    check: ["windows-check", "cleanup", "repair", "apps-export", "apps-import", "drivers-export", "drivers-import", "wallpapers"],
    undo:  ["windows-revert", "chrome-revert", "brave-revert", "firefox-revert", "dev-revert", "fonts-revert"],
  };

  let lang = "en";
  try { lang = localStorage.getItem("lang") || (navigator.language.toLowerCase().startsWith("pt") ? "pt" : "en"); } catch {}

  function render() {
    const t = text[lang];
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    for (const [id, names] of Object.entries(lists)) {
      const ul = document.getElementById(id);
      ul.replaceChildren();
      for (const name of names) {
        const cmd = `irm ${base}/${name} | iex`;
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.className = "cmd";
        btn.textContent = cmd;
        btn.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(cmd); } catch { return; }
          btn.textContent = t.copied;
          btn.classList.add("copied");
          setTimeout(() => { btn.textContent = cmd; btn.classList.remove("copied"); }, 1200);
        });
        const p = document.createElement("p");
        p.className = "desc";
        p.textContent = t[name];
        li.append(btn, p);
        const groupsFor = options[name];
        if (groupsFor) {
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = t.options;
          det.appendChild(sum);
          for (const g of groupsFor) {
            if (g.g[lang]) { const h = document.createElement("h3"); h.textContent = g.g[lang]; det.appendChild(h); }
            const dl = document.createElement("dl");
            for (const it of g.items) {
              const dt = document.createElement("dt");
              dt.textContent = it.n[lang];
              if (it.k !== "auto") {
                const tag = document.createElement("span");
                tag.className = "tag";
                const def = it.k === "choice" ? `${t.def}: ${it.d[lang]}`
                          : it.d === "local" ? t.local : (it.d ? t.yes : t.no);
                tag.textContent = ` (${t.asks}, ${def})`;
                dt.appendChild(tag);
              }
              const dd = document.createElement("dd");
              dd.textContent = it.t[lang];
              dl.append(dt, dd);
            }
            det.appendChild(dl);
          }
          li.appendChild(det);
        }
        ul.appendChild(li);
      }
    }
  }

  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch {}
    render();
  }));

  render();
</script>
