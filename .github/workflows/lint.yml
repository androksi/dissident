name: lint

on:
  push:
  pull_request:

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check UTF-8 BOM (needed by Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $missing = Get-ChildItem scripts -Recurse -Filter *.ps1 | Where-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            -not ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          }
          if ($missing) { $missing | ForEach-Object { "::error file=$($_.FullName)::missing UTF-8 BOM" }; exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
