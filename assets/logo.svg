  <g fill="#e6edf3">
    <rect x="30" y="30" width="46" height="46" rx="4"/>
    <rect x="84" y="30" width="46" height="46" rx="4"/>
    <rect x="30" y="84" width="46" height="46" rx="4"/>
    <rect x="84" y="84" width="46" height="46" rx="4"/>
  </g>
  <g stroke="#0d1117" stroke-width="3" stroke-linecap="round">
    <line x1="36" y1="42" x2="70" y2="42"/><line x1="36" y1="53" x2="70" y2="53"/><line x1="36" y1="64" x2="70" y2="64"/>
    <line x1="90" y1="42" x2="124" y2="42"/><line x1="90" y1="53" x2="124" y2="53"/><line x1="90" y1="64" x2="124" y2="64"/>
    <line x1="36" y1="96" x2="70" y2="96"/><line x1="36" y1="107" x2="70" y2="107"/><line x1="36" y1="118" x2="70" y2="118"/>
    <line x1="90" y1="96" x2="124" y2="96"/><line x1="90" y1="107" x2="124" y2="107"/><line x1="90" y1="118" x2="124" y2="118"/>
  </g>
  <circle cx="80" cy="80" r="9" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>
  <rect x="78" y="76" width="4" height="8" rx="1" fill="#e6edf3"/>
