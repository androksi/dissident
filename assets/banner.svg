<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="The TidyWin menu running in Windows PowerShell">
  <!-- Terminal window showing the TidyWin menu (scripts/TidyWin.ps1) as it opens. -->
  <style>
    text { font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, ui-monospace, monospace; font-size: 17px; fill: #e6edf3; white-space: pre; }
    .ui    { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 13px; fill: #8b949e; }
    .dim   { fill: #8b949e; }
    .cmd   { fill: #e6edf3; }
    .url   { fill: #79c0ff; }
    .title { fill: #3fb950; }
    .group { fill: #d29922; }
    .sel   { fill: #39c5cf; }
    .item  { fill: #c9d1d9; }
    .desc  { fill: #ffffff; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="958" height="638" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h934 a12 12 0 0 1 12 12 v29 h-958 z" fill="#161b22"/>
  <line x1="1" y1="42" x2="959" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- tab -->
  <path d="M16 42 v-24 a6 6 0 0 1 6 -6 h264 a6 6 0 0 1 6 6 v24 z" fill="#0d1117"/>
  <rect x="30" y="21" width="14" height="14" rx="2" fill="#2671be"/>
  <path d="M33 25 l4 3 l-4 3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ui" x="54" y="32">Administrator: Windows PowerShell</text>

  <!-- window controls -->
  <g stroke="#8b949e" stroke-width="1.4" fill="none">
    <line x1="852" y1="22" x2="864" y2="22"/>
    <rect x="886" y="16" width="11" height="11"/>
    <line x1="922" y1="16" x2="933" y2="27"/><line x1="933" y1="16" x2="922" y2="27"/>
  </g>

  <!-- command -->
  <text x="28" y="84"><tspan class="dim">PS C:\&gt;</tspan><tspan class="cmd"> irm </tspan><tspan class="url">androksi.github.io/tidywin/run</tspan><tspan class="cmd"> | iex</tspan></text>

  <!-- menu -->
  <text x="28" y="126" class="title">  TidyWin</text>
  <text x="28" y="152" class="dim">  Windows 11 Pro 24H2 · every option asks before changing anything</text>

  <text x="28" y="190" class="group">  Set up</text>
  <text x="28" y="216" class="sel">  &gt; Windows</text>
  <text x="28" y="242" class="item">    Install apps</text>
  <text x="28" y="268" class="item">    Install fonts</text>
  <text x="28" y="294" class="item">    Chrome</text>
  <text x="28" y="320" class="item">    Brave</text>
  <text x="28" y="346" class="item">    Firefox</text>
  <text x="28" y="372" class="item">    Development</text>
  <text x="28" y="398" class="item">    Wallpapers</text>

  <text x="28" y="436" class="group">  Maintenance</text>
  <text x="28" y="462" class="item">    PC report</text>
  <text x="28" y="488" class="item">    Check after a Windows update</text>
  <text x="28" y="514" class="item">    Uninstall programs</text>

  <!-- description of the selected option, then the keys -->
  <text x="28" y="556" class="desc">  Turns off telemetry, ads and suggestions, removes preinstalled apps and OneDrive,</text>
  <text x="28" y="582" class="desc">  adjusts the taskbar, File Explorer, power and DNS. Asks before each change and…</text>
  <text x="28" y="614" class="dim">  ↑ ↓ choose   Enter run   Esc quit</text>
</svg>
